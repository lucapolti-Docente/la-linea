<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Juego para 4.º a 7.º grado: armar líneas de producción con cintas y estaciones.">
<title>La Línea</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231a2028'/%3E%3Crect x='10' y='42' width='80' height='26' rx='5' fill='%2338434f'/%3E%3Cpath d='M22 48l8 7-8 7M44 48l8 7-8 7M66 48l8 7-8 7' fill='none' stroke='%23f2b632' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
</head>
<body>

<header class="bar">
  <button class="menu-btn" id="menuBtn" data-t-aria="menu.abrir" aria-expanded="false" aria-controls="drawer"><span></span><span></span><span></span></button>
  <div class="brand" data-t-html="marca"></div>
  <div class="bar-info" id="barInfo"></div>
  <button class="snd-btn" id="sndBtn" aria-pressed="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M16 9l6 6M22 9l-6 6"/></svg></button>
  <button class="q-btn" id="qBtn" data-t-aria="juego.ayudaNivel" hidden>?</button>
</header>

<div class="scrim" id="scrim" hidden></div>
<nav class="drawer" id="drawer" data-t-aria="menu.titulo">
  <div class="brand" data-t-html="marca"></div>
  <button class="nav-item" data-go="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="menu.inicio"></span></button>
  <button class="nav-item" data-go="levels"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span data-t="menu.niveles"></span></button>
  <button class="nav-item" data-go="help"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><circle cx="12" cy="17.5" r=".6" fill="currentColor"/></svg><span data-t="menu.ayuda"></span></button>
  <button class="nav-item" data-go="config"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span data-t="menu.progreso"></span></button>
  <div class="foot" data-t="menu.pie"></div>
</nav>

<main>
  <section id="scr-home" class="wrap full">
    <div class="home">
      <div class="home-main">
        <div class="hazard" aria-hidden="true"></div>
        <h1 data-t-html="marca"></h1>
        <canvas class="strip" id="strip" data-t-aria="inicio.tira"></canvas>
      </div>
      <aside class="home-side">
        <button class="btn primary big play" id="playBtn" data-t="inicio.jugar"></button>
        <p class="lead" data-t="inicio.lead"></p>
        <div>
          <div class="eyebrow" data-t="inicio.queVasAUsar"></div>
          <ul class="learn" id="learnList"></ul>
        </div>
        <button class="btn" data-go="help" data-t="menu.ayuda"></button>
      </aside>
    </div>
  </section>

  <section id="scr-diff" class="wrap" hidden>
    <div class="sect-head"><span class="eyebrow" data-t="mundos.eyebrow"></span><h2 data-t="mundos.titulo"></h2></div>
    <div class="diff-grid" id="worldCards"></div>
  </section>

  <section id="scr-levels" class="wrap" hidden>
    <div class="sect-head"><span class="eyebrow" data-t="niveles.eyebrow"></span><h2 id="lvTitle"></h2></div>
    <div class="acts" id="acts"></div>
  </section>

  <section id="scr-help" class="wrap" hidden>
    <div class="sect-head"><span class="eyebrow" data-t="ayuda.eyebrow"></span><h2 data-t="menu.ayuda"></h2></div>
    <div class="help" id="helpList"></div>
  </section>

  <section id="scr-config" class="wrap" hidden>
    <div class="sect-head"><span class="eyebrow" data-t="progreso.eyebrow"></span><h2 data-t="menu.progreso"></h2></div>
    <div class="prog">
      <div class="prog-world"><h3 data-t="progreso.nombre"></h3><p class="sum" data-t="progreso.nombreAyuda"></p>
        <div class="prog-row"><input id="pName" maxlength="40" data-t-placeholder="progreso.nombrePlaceholder"><button class="btn" id="pCopy" data-t="progreso.copiar"></button></div></div>
      <div id="pWorlds" class="prog"></div>
      <textarea id="pText" hidden readonly></textarea>
      <div class="prog-world"><h3 data-t="progreso.docentes"></h3><p class="sum" data-t="progreso.docentesAyuda"></p>
        <div class="prog-row"><button class="btn" id="pReset" data-t="progreso.borrar"></button></div></div>
    </div>
  </section>

  <section id="scr-game" class="wrap full" hidden>
    <div class="game">
      <aside class="goal">
        <div class="card">
          <h3 data-t="juego.objetivo"></h3>
          <p class="goal-txt" id="goalTxt"></p>
          <div class="steps" id="orderSteps"></div>
        </div>
        <div class="card" id="newCard">
          <h3 data-t="juego.loNuevo"></h3>
          <div class="news" id="newsList"></div>
          <button class="btn" id="qBtn2" data-t="juego.verTodo"></button>
        </div>
      </aside>
      <div class="board-col">
        <div class="board-wrap" id="boardWrap">
          <canvas id="board" data-t-aria="juego.tablero"></canvas>
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
          <div class="pick" id="pick" hidden></div>
        </div>
        <p class="board-hint" id="boardHint"></p>
      </div>
      <aside class="side">
        <div class="card controls">
          <div class="run-row">
            <button class="btn primary big" id="runBtn"></button>
            <button class="btn paso" id="stepBtn" data-t="juego.paso" data-t-aria="juego.pasoAyuda"></button>
          </div>
          <div class="speed" role="group" data-t-aria="juego.velocidad">
            <button data-speed="1" aria-pressed="true">x1</button>
            <button data-speed="2" aria-pressed="false">x2</button>
            <button data-speed="4" aria-pressed="false">x4</button>
          </div>
        </div>
        <div class="card">
          <h3 data-t="juego.pedido"></h3>
          <div class="order"><canvas id="orderIcon" width="60" height="60"></canvas><div><div class="qty" id="orderQty"></div><div class="what" id="orderWhat"></div></div></div>
          <div class="slots" id="slots"></div>
          <div class="deadline" id="deadline" hidden></div>
          <div class="stats">
            <div class="stat"><div class="k" data-t="juego.reloj"></div><div class="v" id="clock">0:00</div></div>
            <div class="stat"><div class="k" data-t="juego.errores"></div><div class="dots" id="errDots"></div></div>
          </div>
          <div class="loop" id="loopTxt"></div>
        </div>
        <div class="card">
          <h3 data-t="juego.piezas"></h3>
          <div class="ptabs" id="ptabs" role="tablist"></div>
          <div class="palette" id="palette" role="toolbar" data-t-aria="juego.paleta"></div>
        </div>
        <div class="row2">
          <button class="btn" id="resetBtn" data-t="juego.reiniciar"></button>
          <button class="btn" id="hintBtn" data-t="juego.pista"></button>
          <button class="btn" id="clearBtn" data-t="juego.borrarTodo"></button>
          <button class="btn" id="newBtn" data-t="juego.otraLinea"></button>
        </div>
      </aside>
    </div>
  </section>
</main>

<div class="modal" id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"><div class="hazard"></div><div class="modal-body" id="modalBody"></div></div></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
